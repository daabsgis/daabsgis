    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        :root {
            --bg: #02070d;
            --bg-soft: #06111a;
            --panel: rgba(6, 18, 27, 0.82);
            --line: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --muted: #a8b5c3;
            --green: #16d99a;
            --green-2: #0bbf86;
            --blue: #38bdf8;
        }
        body {
            background: var(--bg);
            /* fixed nav offset handled on sections */
            color: var(--muted);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }
        a { color: inherit; }
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            background: rgba(2, 7, 13, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(148,163,184,.12);
            padding: 1.15rem 3.8vw;
        }
        .nav-container {
            max-width: 1550px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; gap: 2rem;
        }
        .nav-brand { display: flex; align-items: center; gap: .75rem; text-decoration: none; min-width: 260px; }
        .nav-brand-globe { width: 58px; height: 58px; object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 15px rgba(56,189,248,.22)); }
        .nav-brand-name { color: #fff; font-size: 1.35rem; font-weight: 850; letter-spacing: -.035em; white-space: nowrap; }
        .nav-brand-name span { color: var(--green); }
        .nav-menu-wrap { position: relative; margin-left: auto; }
        .menu-toggle { width: 48px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; background: rgba(2,7,13,.55); cursor: pointer; transition: .2s; }
        .menu-toggle:hover, .menu-toggle[aria-expanded="true"] { border-color: rgba(22,217,154,.7); background: rgba(22,217,154,.08); }
        .menu-toggle span { width: 20px; height: 2px; border-radius: 2px; background: #fff; transition: .2s; }
        .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
        .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .nav-links { position: absolute; right: 0; top: calc(100% + 12px); min-width: 190px; display: flex; flex-direction: column; gap: .2rem; padding: .6rem; border: 1px solid rgba(148,163,184,.16); border-radius: 14px; background: rgba(4,13,21,.96); backdrop-filter: blur(16px); box-shadow: 0 20px 50px rgba(0,0,0,.35); opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.98); transform-origin: top right; transition: .2s ease; }
        .nav-links.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        .nav-links a { color: #d8e0e8; text-decoration: none; font-size: .92rem; font-weight: 600; transition: .2s; padding: .75rem .85rem; border-radius: 9px; }
        .nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(22,217,154,.08); }
        .nav-links a.active { box-shadow: inset 2px 0 0 var(--green); }

        header {
            position: relative; min-height: 780px; height: 92vh; max-height: 980px;
            display: flex; align-items: center; overflow: hidden;
            background: #02070d;
            border-bottom: 1px solid rgba(148,163,184,.10);
        }
        header::before, header::after { display: none; }
        .hero-bg {
            position: absolute; inset: 0; z-index: 0;
            width: 100%; height: 100%;
            object-fit: cover; object-position: center 40%;
            display: block;
            filter: saturate(1.05) contrast(1.05) brightness(0.85);
        }
        .hero-overlay {
            position: absolute; inset: 0; z-index: 1;
            background:
                linear-gradient(90deg, rgba(2,7,13,.88) 0%, rgba(2,7,13,.55) 42%, rgba(2,7,13,.25) 70%, rgba(2,7,13,.45) 100%),
                linear-gradient(180deg, rgba(2,7,13,.55) 0%, transparent 30%, transparent 65%, rgba(2,7,13,.75) 100%),
                radial-gradient(ellipse at 70% 45%, transparent 20%, rgba(2,7,13,.4) 100%);
            pointer-events: none;
        }
        .hero-container { position: relative; z-index: 2; width: 100%; max-width: 1550px; margin: 0 auto; padding: 7.5rem 4vw 4rem; }
        .hero-copy { position: relative; z-index: 5; width: min(100%, 720px); max-width: 720px; }
        .eyebrow { display: flex; align-items: center; gap: .8rem; color: var(--green); font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 1.6rem; }
        .eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
        h1 { color: #fff; font-size: clamp(3.1rem, 4.25vw, 4.7rem); font-weight: 850; letter-spacing: -.055em; line-height: .99; max-width: 760px; margin-bottom: 1.8rem; }
        .highlight { color: var(--green); }
        .hero-description { max-width: 610px; color: #b6c2ce; font-size: 1.05rem; line-height: 1.85; margin-bottom: 2.25rem; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 1rem; }
        .btn-primary, .btn-secondary { display: inline-flex; align-items: center; justify-content: center; gap: .85rem; padding: .95rem 1.5rem; border-radius: .75rem; text-decoration: none; font-size: .92rem; font-weight: 750; transition: .2s; }
        .btn-primary { background: linear-gradient(135deg, #18d99a, #0ba979); color: #02110c; box-shadow: 0 12px 35px rgba(22,217,154,.18); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 42px rgba(22,217,154,.28); }
        .btn-secondary { border: 1px solid rgba(22,217,154,.55); color: #fff; background: rgba(2,7,13,.35); }
        .btn-secondary:hover { background: rgba(22,217,154,.08); transform: translateY(-2px); }
        .btn-secondary svg, .btn-primary svg { width: 20px; height: 20px; }
        .hero-globe-wrap {
            position: absolute; z-index: 2;
            width: min(48vw, 620px); height: min(34vw, 420px);
            right: 2vw; top: 50%; transform: translateY(-50%);
            pointer-events: none;
            border-radius: 1.1rem;
            overflow: hidden;
            border: 1px solid rgba(56,189,248,.18);
            box-shadow: 0 25px 60px rgba(0,0,0,.45), 0 0 40px rgba(22,217,154,.08);
            animation: globeFloat 7s ease-in-out infinite;
        }
        .hero-globe {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center;
            display: block;
            border-radius: 0;
            filter: saturate(1.05) contrast(1.05) brightness(0.92);
            animation: none;
        }
        .hero-globe-vignette {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 60% 40%, transparent 35%, rgba(2,7,13,.55) 100%),
                linear-gradient(90deg, rgba(2,7,13,.65) 0%, transparent 28%, transparent 100%);
            pointer-events: none;
        }
        .hero-globe-wrap::before { display: none; }
        @keyframes globeFloat {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(calc(-50% - 10px)); }
        }
        .hero-label { position: absolute; z-index: 4; border: 1px solid rgba(56,189,248,.18); background: rgba(2,12,20,.68); backdrop-filter: blur(8px); padding: .65rem .85rem; border-radius: .45rem; color: #bcd1dc; font-size: .7rem; letter-spacing: .03em; }
        .hero-label strong { display: block; color: var(--green); font-size: .65rem; text-transform: uppercase; margin-bottom: .1rem; }
        .hero-label .hero-label.spatial { bottom: 20%; right: 9%; }

        section { max-width: 1200px; margin: 0 auto; padding: 7rem 2rem; }
        .section-title { font-size: 2rem; color: #fff; font-weight: 800; margin-bottom: 2rem; text-align: center; letter-spacing: -.03em; }
        .profile-block { max-width: 1000px; margin: 0 auto 3rem; }
        .profile-text {
            color: #94a3b8;
            font-size: 18px;
            line-height: 1.75;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 820px;
            margin: 0 auto;
            text-align: center;
        }
        .profile-text p { margin: 0; }
        .expertise-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
        .exp-card { background: linear-gradient(145deg, rgba(12,29,40,.95), rgba(6,17,25,.95)); padding: 1.65rem; border-radius: .9rem; border: 1px solid rgba(148,163,184,.12); transition: .2s; }
        .exp-card:hover { border-color: rgba(22,217,154,.35); transform: translateY(-3px); }
        .exp-card h3 { color: white; font-size: 1.05rem; margin: .55rem 0; font-weight: 700; }
        .exp-card p { color: #94a3b8; font-size: .82rem; line-height: 1.6; }
        .exp-icon { color: var(--green); font-size: 1.3rem; }

        .tech-flex { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 1rem; max-width: 1000px; margin: 0 auto 3rem; }
        .tech-card { display: flex; align-items: center; gap: 1rem; min-height: 100px; padding: 1rem 1.15rem; border: 1px solid rgba(148,163,184,.14); border-radius: .9rem; background: linear-gradient(145deg, rgba(10,27,38,.95), rgba(3,13,21,.95)); transition: .2s; }
        .tech-card:hover { transform: translateY(-3px); border-color: rgba(22,217,154,.4); box-shadow: 0 12px 30px rgba(0,0,0,.2); }
        .app-logo { width: 52px; height: 52px; flex: 0 0 52px; display: grid; place-items: center; border-radius: 13px; background: #07151e; border: 1px solid rgba(148,163,184,.12); overflow: hidden; }
        .app-logo img { width: 40px; height: 40px; object-fit: contain; display: block; }
        .app-logo svg { width: 38px; height: 38px; }
        .tech-card h3 { color: #fff; font-size: .92rem; margin-bottom: .12rem; }
        .tech-card p { color: #718394; font-size: .7rem; }
        .dataset-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .75rem; }
        .data-card { background: #07141e; border: 1px solid rgba(148,163,184,.13); padding: .85rem; border-radius: .6rem; font-size: .75rem; text-align: center; color: #94a3b8; }

        .contact-links { display: flex; justify-content: center; gap: 1.25rem; }
        .contact-link { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: #07141e; border: 1px solid rgba(148,163,184,.14); border-radius: 50%; color: var(--green); transition: .2s; }
        .contact-link svg { width: 24px; height: 24px; }
        .contact-link:hover { border-color: var(--green); background: #0b2330; transform: translateY(-2px); }
        footer { border-top: 1px solid rgba(148,163,184,.12); background: #01050a; padding: 2rem; text-align: center; font-size: .75rem; color: #526170; }

        @media (max-width: 1100px) {
            .hero-copy { width: 70%; max-width: 640px; }
        }
        @media (max-width: 820px) {
            nav { padding: .8rem 1rem; position: fixed; }
            .nav-container { flex-wrap: wrap; }
            .nav-brand { min-width: auto; }
            .nav-brand-globe { width: 44px; height: 44px; }
            .nav-brand-name { font-size: 1.05rem; }
            .nav-links { top: calc(100% + 10px); }
            header { min-height: 720px; height: auto; }
            .hero-container { padding: 8rem 1.25rem 4rem; }
            .hero-copy { width: 100%; max-width: 650px; }
            h1 { font-size: clamp(2.65rem, 11vw, 4.5rem); }
            .expertise-grid, .tech-flex { grid-template-columns: 1fr; }
            .dataset-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 520px) {
            .nav-menu-wrap { margin-left: auto; }
            .hero-description { font-size: .94rem; }
            .hero-actions { flex-direction: column; align-items: stretch; }
            .btn-primary, .btn-secondary { width: 100%; }
            .hero-label, .coordinate { display: none; }
            section { padding: 5rem 1.25rem; }
        } }

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-links');
        menuToggle.addEventListener('click', () => {
            const isOpen = navMenu.classList.toggle('open');
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            menuToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
        });
        navMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('open');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Open navigation menu');
            });
        });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('.nav-menu-wrap')) {
                navMenu.classList.remove('open');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Open navigation menu');
            }
        });
